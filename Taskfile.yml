# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

vars:
  GOLANGCILINT: "go tool -modfile={{.ROOT_DIR}}/tools/golangci-lint.mod golangci-lint"
  BUF: "go tool -modfile={{.ROOT_DIR}}/tools/buf.mod buf"
  SQLC: "go tool -modfile={{.ROOT_DIR}}/tools/sqlc.mod sqlc"
  DEV_COMPOSE: "-f deploy/docker-compose-dev.yml"

tasks:
  fmt:
    desc: Форматирование кода
    cmd: "{{.GOLANGCILINT}} fmt ./..."
    silent: true

  lint:
    desc: Линтинг кода
    cmd: "{{.GOLANGCILINT}} run --fix ./..."
    silent: true

  test:unit:
    desc: Запуск юнит-тестов
    cmd: go test ./...
    silent: true

  check:
    desc: Набор проверок перед коммитом
    deps: [fmt, lint, test:unit]
    silent: true

  ci:
    desc: Набор проверок без исправлений
    cmds:
      - "{{.GOLANGCILINT}} fmt --diff ./..."
      - "{{.GOLANGCILINT}} run ./..."
      - task test:unit
    silent: true

  generate:
    desc: Сгенерировать контракты и запросы
    cmds:
      - "{{.BUF}} generate"
      - "{{.SQLC}} generate"
    silent: true

  migrate:
    desc: Миграции сервиса
    dotenv: [.env]
    cmd: go run ./migrations/cmd {{.CLI_ARGS}}
    silent: true

  certs:
    desc: Сертификаты mTLS для локального запуска
    cmd: sh deploy/certs/generate.sh
    silent: true

  test:integration:
    desc: Запуск интеграционных тестов
    cmd: go test -tags=integration ./...
    silent: true

  dev:start:
    desc: Развернуть инфраструктуру для разработки
    dotenv: [.env]
    cmd: docker compose {{.DEV_COMPOSE}} up -d
    silent: true

  dev:stop:
    desc: Остановить инфраструктуру для разработки
    dotenv: [.env]
    cmd: docker compose {{.DEV_COMPOSE}} down -v
    silent: true

  run:gateway:
    desc: Gateway, stdout дополнительно в deploy/logs/gateway.jsonl
    dotenv: [.env]
    cmd: mkdir -p deploy/logs && go run ./services/gateway/cmd/gateway 2>&1 | tee -a deploy/logs/gateway.jsonl

  run:auth:
    desc: Auth, stdout дополнительно в deploy/logs/auth.jsonl
    dotenv: [.env]
    cmd: mkdir -p deploy/logs && go run ./services/auth/cmd/auth 2>&1 | tee -a deploy/logs/auth.jsonl

  run:subscriptions:
    desc: Subscriptions, stdout дополнительно в deploy/logs/subscriptions.jsonl
    dotenv: [.env]
    cmd: mkdir -p deploy/logs && go run ./services/subscriptions/cmd/subscriptions 2>&1 | tee -a deploy/logs/subscriptions.jsonl

  run:usage:
    desc: Usage, stdout дополнительно в deploy/logs/usage.jsonl
    dotenv: [.env]
    cmd: mkdir -p deploy/logs && go run ./services/usage/cmd/usage 2>&1 | tee -a deploy/logs/usage.jsonl
