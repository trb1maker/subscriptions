# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

vars:
  GOLANGCILINT: "go tool -modfile={{.ROOT_DIR}}/tools/golangci-lint.mod golangci-lint"
  BUF: "go tool -modfile={{.ROOT_DIR}}/tools/buf.mod buf"
  SQLC: "go tool -modfile={{.ROOT_DIR}}/tools/sqlc.mod sqlc"
  DEV_COMPOSE: "-f deploy/docker-compose-dev.yml"
  HA_COMPOSE: "-f deploy/docker-compose-ha.yml"

tasks:
  generate:
    desc: Сгенерировать контракты и запросы
    cmds:
      - "{{.BUF}} generate"
      - "{{.SQLC}} generate"
    silent: true
  
  certs:
    desc: Сгенерировать сертификаты mTLS для локального запуска
    cmd: sh deploy/certs/generate.sh
    silent: true
  
  fmt:
    desc: Форматирование кода
    cmd: "{{.GOLANGCILINT}} fmt ./..."
    silent: true

  lint:
    desc: Линтинг кода
    cmd: "{{.GOLANGCILINT}} run --fix ./..."
    silent: true

  test:unit:
    desc: Запуск юнит-тестов
    cmd: go test ./...
    silent: true

  test:integration:
    desc: Запуск интеграционных тестов
    cmd: go test -tags=integration -timeout 15m ./...
    silent: true
  
  check:
    desc: Набор проверок перед коммитом
    deps: [fmt, lint, test:unit]
    silent: true

  ci:
    desc: Набор проверок без исправлений
    cmds:
      - "{{.GOLANGCILINT}} fmt --diff ./..."
      - "{{.GOLANGCILINT}} run ./..."
      - task test:unit
    silent: true

  test:load:
    desc: Нагрузочный тест на testcontainers
    cmd: go test -tags=load -count=1 -timeout 15m ./tests/load
    silent: true

  demo:up:
    desc: Собрать сервисы и поднять стенд для демонстрации
    dotenv: [.env]
    cmds:
      - sh -c 'test -f deploy/certs/subscriptions.crt || { echo "Сначала task certs"; exit 1; }'
      - docker compose {{.DEV_COMPOSE}} --profile demo up -d --build

  demo:
    desc: Сценарий нагрузки на уже поднятый стенд
    cmd: go run ./tests/demo {{.CLI_ARGS}}

  demo:down:
    desc: Остановить стенд демонстрации
    dotenv: [.env]
    cmd: docker compose {{.DEV_COMPOSE}} --profile demo down -v
    silent: true

  ha:up:
    desc: Поднять отказоустойчивый стенд
    dotenv: [.env]
    cmds:
      - sh -c 'test -f deploy/certs/subscriptions.crt || { echo "Сначала task certs"; exit 1; }'
      - docker compose {{.HA_COMPOSE}} --profile demo up -d --build

  ha:down:
    desc: Остановить отказоустойчивый стенд
    dotenv: [.env]
    cmd: docker compose {{.HA_COMPOSE}} --profile demo down -v
    silent: true
