openapi: 3.0.3
info:
  title: Gateway API
  version: 1.0.0
paths:
  /health:
    get:
      operationId: health
      summary: Проверка здоровья
      responses:
        "200":
          description: Сервис принимает запросы
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthOk"
        "503":
          description: Зависимость не принимает запросы
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthUnavailable"
  /api/v1/users:
    post:
      operationId: registerUser
      summary: Регистрация пользователя
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterUserRequest"
      responses:
        "201":
          description: Пользователь создан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterUserResponse"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/login:
    post:
      operationId: login
      summary: Аутентификация
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Выдан JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/organizations:
    post:
      operationId: createOrganization
      summary: Создание организации
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrganizationRequest"
      responses:
        "201":
          description: Организация создана
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateOrganizationResponse"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/tariffs:
    post:
      operationId: createTariff
      summary: Создание тарифа
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTariffRequest"
      responses:
        "201":
          description: Тариф создан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tariff"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
    get:
      operationId: listTariffs
      summary: Каталог тарифов
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Список тарифов
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TariffList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/subscriptions:
    post:
      operationId: createSubscription
      summary: Создание подписки
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSubscriptionRequest"
      responses:
        "201":
          description: Подписка создана
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/subscriptions/{id}:
    parameters:
      - $ref: "#/components/parameters/SubscriptionID"
    put:
      operationId: changeSubscription
      summary: Смена тарифа подписки
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeSubscriptionRequest"
      responses:
        "200":
          description: Подписка изменена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
    get:
      operationId: getSubscription
      summary: Получение подписки
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Подписка
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/generate:
    post:
      operationId: generate
      summary: Эмуляция генерации ответа
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/GenerateIdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateRequest"
      responses:
        "200":
          description: Генерация завершена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateResponse"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
  /webhooks/payments:
    post:
      operationId: acceptPaymentWebhook
      summary: Приём вебхука платежа
      parameters:
        - $ref: "#/components/parameters/WebhookKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentWebhook"
      responses:
        "202":
          description: Платёж принят
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
    GenerateIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Идентификатор события генерации
      schema:
        type: string
        format: uuid
    WebhookKey:
      name: X-Webhook-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
    SubscriptionID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    InvalidArgument:
      description: Некорректный запрос
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthenticated:
      description: Нет доступа
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Недостаточно прав
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Объект не найден
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Конфликт состояния
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Internal:
      description: Внутренняя ошибка
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unavailable:
      description: Зависимость недоступна
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    HealthOk:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
    HealthUnavailable:
      type: object
      additionalProperties: false
      required:
        - status
        - checks
      properties:
        status:
          type: string
          enum:
            - unavailable
        checks:
          type: object
          minProperties: 1
          additionalProperties:
            type: string
            enum:
              - unavailable
    RegisterUserRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          type: string
        password:
          type: string
          format: password
        organization_id:
          type: string
          format: uuid
    RegisterUserResponse:
      type: object
      additionalProperties: false
      required:
        - user_id
        - token
      properties:
        user_id:
          type: string
          format: uuid
        token:
          type: string
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          type: string
        password:
          type: string
          format: password
    LoginResponse:
      type: object
      additionalProperties: false
      required:
        - token
      properties:
        token:
          type: string
    CreateOrganizationRequest:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
    CreateOrganizationResponse:
      type: object
      additionalProperties: false
      required:
        - organization_id
        - token
      properties:
        organization_id:
          type: string
          format: uuid
        token:
          type: string
    CreateTariffRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - monthly_price_minor
        - message_limit
        - type
        - is_base_tariff
      properties:
        name:
          type: string
        monthly_price_minor:
          type: integer
          minimum: 0
        message_limit:
          type: integer
          minimum: 1
        type:
          type: string
          enum:
            - b2c
            - b2b
        is_base_tariff:
          type: boolean
    Tariff:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - monthly_price_minor
        - message_limit
        - type
        - is_base_tariff
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        monthly_price_minor:
          type: integer
          minimum: 0
        message_limit:
          type: integer
          minimum: 1
        type:
          type: string
          enum:
            - b2c
            - b2b
        is_base_tariff:
          type: boolean
    TariffList:
      type: object
      additionalProperties: false
      required:
        - tariffs
      properties:
        tariffs:
          type: array
          items:
            $ref: "#/components/schemas/Tariff"
    CreateSubscriptionRequest:
      type: object
      additionalProperties: false
      required:
        - tariff_id
      properties:
        tariff_id:
          type: string
          format: uuid
    ChangeSubscriptionRequest:
      type: object
      additionalProperties: false
      required:
        - tariff_id
      properties:
        tariff_id:
          type: string
          format: uuid
    PaymentWebhook:
      type: object
      additionalProperties: false
      required:
        - payment_id
        - subscription_id
        - amount_minor
        - occurred_at
      properties:
        payment_id:
          type: string
          format: uuid
        subscription_id:
          type: string
          format: uuid
        amount_minor:
          type: integer
          minimum: 0
        occurred_at:
          type: string
          format: date-time
    GenerateRequest:
      type: object
      additionalProperties: false
      required:
        - prompt
      properties:
        prompt:
          type: string
          minLength: 1
    GenerateResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - tokens
      properties:
        status:
          type: string
          enum:
            - processed
            - failed
        text:
          type: string
          minLength: 1
        tokens:
          type: integer
          minimum: 0
    Subscription:
      type: object
      additionalProperties: false
      required:
        - id
        - tariff_id
        - status
        - message_allowance
        - current_period_start
        - current_period_end
      properties:
        id:
          type: string
          format: uuid
        tariff_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - active
            - suspended
            - expired
        message_allowance:
          type: integer
        current_period_start:
          type: string
          format: date-time
        current_period_end:
          type: string
          format: date-time
    Error:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: string
          enum:
            - invalid_argument
            - unauthenticated
            - forbidden
            - subscription_inactive
            - limit_exceeded
            - not_found
            - conflict
            - internal
            - unavailable
