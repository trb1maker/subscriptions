openapi: 3.0.3
info:
  title: Gateway API
  version: 1.0.0
paths:
  /health:
    get:
      operationId: health
      summary: Проверка здоровья
      responses:
        "200":
          description: Сервис принимает запросы
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthOk"
        "503":
          description: Зависимость не принимает запросы
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthUnavailable"
  /api/v1/users:
    post:
      operationId: registerUser
      summary: Регистрация пользователя
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterUserRequest"
      responses:
        "201":
          description: Пользователь создан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterUserResponse"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/login:
    post:
      operationId: login
      summary: Аутентификация
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Выдан JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/organizations:
    post:
      operationId: createOrganization
      summary: Создание организации
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrganizationRequest"
      responses:
        "201":
          description: Организация создана
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateOrganizationResponse"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
  /webhooks/payments:
    post:
      operationId: acceptPaymentWebhook
      summary: Приём вебхука платежа
      parameters:
        - $ref: "#/components/parameters/WebhookKey"
      responses:
        "202":
          description: Ключ принят, тело не обрабатывается
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthenticated"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
    WebhookKey:
      name: X-Webhook-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
  responses:
    InvalidArgument:
      description: Некорректный запрос
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthenticated:
      description: Нет доступа
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Объект не найден
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Конфликт состояния
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Internal:
      description: Внутренняя ошибка
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unavailable:
      description: Зависимость недоступна
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    HealthOk:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
    HealthUnavailable:
      type: object
      additionalProperties: false
      required:
        - status
        - checks
      properties:
        status:
          type: string
          enum:
            - unavailable
        checks:
          type: object
          minProperties: 1
          additionalProperties:
            type: string
            enum:
              - unavailable
    RegisterUserRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          type: string
        password:
          type: string
          format: password
        organization_id:
          type: string
          format: uuid
    RegisterUserResponse:
      type: object
      additionalProperties: false
      required:
        - user_id
        - token
      properties:
        user_id:
          type: string
          format: uuid
        token:
          type: string
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          type: string
        password:
          type: string
          format: password
    LoginResponse:
      type: object
      additionalProperties: false
      required:
        - token
      properties:
        token:
          type: string
    CreateOrganizationRequest:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
    CreateOrganizationResponse:
      type: object
      additionalProperties: false
      required:
        - organization_id
        - token
      properties:
        organization_id:
          type: string
          format: uuid
        token:
          type: string
    Error:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: string
          enum:
            - invalid_argument
            - unauthenticated
            - not_found
            - conflict
            - internal
            - unavailable
