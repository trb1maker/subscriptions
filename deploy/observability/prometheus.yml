global:
  scrape_interval: 5s

scrape_configs:
  - job_name: gateway
    static_configs:
      - targets: ["gateway:8080"]
  - job_name: auth
    static_configs:
      - targets: ["auth:8081"]
  - job_name: subscriptions
    static_configs:
      - targets: ["subscriptions:8082"]
  - job_name: usage
    static_configs:
      - targets: ["usage:8083"]
