services:
  postgres:
    image: postgres:18.6-alpine3.24
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - 55432:5432
    volumes:
      - ./postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  clickhouse:
    image: clickhouse:26.7
    environment:
      - CLICKHOUSE_USER=${CLICKHOUSE_USER}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
    ports:
      - 58123:8123
      - 59000:9000
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: [ "CMD-SHELL", "clickhouse-client --host 127.0.0.1 --user ${CLICKHOUSE_USER} --password ${CLICKHOUSE_PASSWORD} --query 'SELECT 1'" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.10-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - 56379:6379
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  nats:
    image: nats:2.14-alpine
    command: [ "-js", "-m", "8222" ]
    ports:
      - 54222:4222
      - 58222:8222
    healthcheck:
      test: [ "CMD", "nc", "-z", "localhost", "4222" ]
      interval: 5s
      timeout: 2s
      retries: 5

  prometheus:
    image: prom/prometheus:v3.4.1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - 59090:9090
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  jaeger:
    image: jaegertracing/all-in-one:1.67.0
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - 56686:16686
      - 54317:4317

  vector:
    image: timberio/vector:0.46.1-debian
    user: "0:0"
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      - CLICKHOUSE_USER=${CLICKHOUSE_USER}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
    volumes:
      - ./observability/vector.yaml:/etc/vector/vector.yaml:ro
      - ./logs:/var/log/subscriptions
      - ./observability/vector-data:/var/lib/vector

  grafana:
    image: grafana/grafana:11.6.1
    depends_on:
      - prometheus
      - jaeger
      - clickhouse
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_INSTALL_PLUGINS=grafana-clickhouse-datasource
      - CLICKHOUSE_USER=${CLICKHOUSE_USER}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
    ports:
      - 53000:3000
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
