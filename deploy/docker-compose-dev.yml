services:
  postgres:
    image: postgres:18.6-alpine3.24
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - 55432:5432
    volumes:
      - ./postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  clickhouse:
    image: clickhouse:26.7
    environment:
      - CLICKHOUSE_USER=${CLICKHOUSE_USER}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
    ports:
      - 58123:8123
      - 59000:9000
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: [ "CMD-SHELL", "clickhouse-client --host 127.0.0.1 --user ${CLICKHOUSE_USER} --password ${CLICKHOUSE_PASSWORD} --query 'SELECT 1'" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.10-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - 56379:6379
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  nats:
    image: nats:2.14-alpine
    command: [ "-js", "-m", "8222" ]
    ports:
      - 54222:4222
      - 58222:8222
    healthcheck:
      test: [ "CMD", "nc", "-z", "localhost", "4222" ]
      interval: 5s
      timeout: 2s
      retries: 5

  prometheus:
    image: prom/prometheus:v3.4.1
    ports:
      - 59090:9090
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  jaeger:
    image: jaegertracing/all-in-one:1.67.0
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - 56686:16686
      - 54317:4317

  vector:
    image: timberio/vector:0.46.1-debian
    user: "0:0"
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      - CLICKHOUSE_USER=${CLICKHOUSE_USER}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
    volumes:
      - ./observability/vector.yaml:/etc/vector/vector.yaml:ro
      - ./observability/vector-data:/var/lib/vector
      - /var/run/docker.sock:/var/run/docker.sock:ro

  grafana:
    image: grafana/grafana:11.6.1
    depends_on:
      - prometheus
      - jaeger
      - clickhouse
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_INSTALL_PLUGINS=grafana-clickhouse-datasource
      - CLICKHOUSE_USER=${CLICKHOUSE_USER}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
    ports:
      - 53000:3000
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro

  migrate-auth:
    profiles: ["demo"]
    image: subscriptions-migrate
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        PACKAGE: ./migrations/cmd
    command: ["auth", "up"]
    environment:
      AUTH_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/auth?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  migrate-subscriptions:
    profiles: ["demo"]
    image: subscriptions-migrate
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        PACKAGE: ./migrations/cmd
    command: ["subscriptions", "up"]
    environment:
      SUBSCRIPTIONS_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/subscriptions?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  migrate-usage:
    profiles: ["demo"]
    image: subscriptions-migrate
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        PACKAGE: ./migrations/cmd
    command: ["usage", "up"]
    environment:
      USAGE_CLICKHOUSE_DSN: clickhouse://${CLICKHOUSE_USER}:${CLICKHOUSE_PASSWORD}@clickhouse:9000/default
    depends_on:
      clickhouse:
        condition: service_healthy
    restart: "no"

  auth:
    profiles: ["demo"]
    container_name: subscriptions-auth
    image: subscriptions-auth
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        PACKAGE: ./services/auth/cmd/auth
    environment:
      HTTP_ADDR: ":8081"
      GRPC_ADDR: ":9091"
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4317
      AUTH_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/auth?sslmode=disable
      JWT_SECRET: dev-secret
      JWT_TTL: 12h
      TLS_CERT_FILE: /certs/auth.crt
      TLS_KEY_FILE: /certs/auth.key
      TLS_CA_FILE: /certs/ca.crt
    ports:
      - "8081:8081"
    volumes:
      - ./certs:/certs:ro
    depends_on:
      migrate-auth:
        condition: service_completed_successfully

  subscriptions:
    profiles: ["demo"]
    container_name: subscriptions-subscriptions
    image: subscriptions-subscriptions
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        PACKAGE: ./services/subscriptions/cmd/subscriptions
    environment:
      HTTP_ADDR: ":8082"
      GRPC_ADDR: ":9092"
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4317
      SUBSCRIPTIONS_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/subscriptions?sslmode=disable
      AUTH_GRPC_ADDR: auth:9091
      AUTH_GRPC_SERVER_NAME: auth
      USAGE_GRPC_ADDR: usage:9093
      USAGE_GRPC_SERVER_NAME: usage
      SUBSCRIPTIONS_NATS_URL: nats://nats:4222
      SUBSCRIPTIONS_REQUEST_PEPPER: pepper
      TLS_CERT_FILE: /certs/subscriptions.crt
      TLS_KEY_FILE: /certs/subscriptions.key
      TLS_CA_FILE: /certs/ca.crt
    ports:
      - "8082:8082"
    volumes:
      - ./certs:/certs:ro
    depends_on:
      migrate-subscriptions:
        condition: service_completed_successfully
      auth:
        condition: service_started
      usage:
        condition: service_started
      nats:
        condition: service_healthy

  usage:
    profiles: ["demo"]
    container_name: subscriptions-usage
    image: subscriptions-usage
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        PACKAGE: ./services/usage/cmd/usage
    environment:
      HTTP_ADDR: ":8083"
      GRPC_ADDR: ":9093"
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4317
      USAGE_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      USAGE_CLICKHOUSE_DSN: clickhouse://${CLICKHOUSE_USER}:${CLICKHOUSE_PASSWORD}@clickhouse:9000/default
      USAGE_NATS_URL: nats://nats:4222
      AUTH_GRPC_ADDR: auth:9091
      AUTH_GRPC_SERVER_NAME: auth
      TLS_CERT_FILE: /certs/usage.crt
      TLS_KEY_FILE: /certs/usage.key
      TLS_CA_FILE: /certs/ca.crt
    ports:
      - "8083:8083"
    volumes:
      - ./certs:/certs:ro
    depends_on:
      migrate-usage:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      nats:
        condition: service_healthy
      auth:
        condition: service_started

  gateway:
    profiles: ["demo"]
    container_name: subscriptions-gateway
    image: subscriptions-gateway
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        PACKAGE: ./services/gateway/cmd/gateway
    environment:
      HTTP_ADDR: ":8080"
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4317
      AUTH_GRPC_ADDR: auth:9091
      AUTH_GRPC_SERVER_NAME: auth
      SUBSCRIPTIONS_GRPC_ADDR: subscriptions:9092
      SUBSCRIPTIONS_GRPC_SERVER_NAME: subscriptions
      USAGE_GRPC_ADDR: usage:9093
      USAGE_GRPC_SERVER_NAME: usage
      GATEWAY_NATS_URL: nats://nats:4222
      WEBHOOK_KEY: webhook-secret
      GENERATE_DELAY_MIN: 50ms
      GENERATE_DELAY_MAX: 200ms
      GENERATE_FAILURE_PERCENT: "5"
      TLS_CERT_FILE: /certs/gateway.crt
      TLS_KEY_FILE: /certs/gateway.key
      TLS_CA_FILE: /certs/ca.crt
    ports:
      - "8080:8080"
    volumes:
      - ./certs:/certs:ro
    depends_on:
      auth:
        condition: service_started
      subscriptions:
        condition: service_started
      usage:
        condition: service_started
      nats:
        condition: service_healthy
